name: Build Hermes Agent

on:
  push:
    branches:
      - main
    paths:
      - "images/hermes-agent/**"
      - ".github/workflows/build-hermes-agent.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-hermes-agent
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Test image
        run: ./images/hermes-agent/test.sh

      - name: Get image version
        id: version
        working-directory: images/hermes-agent
        run: |
          version="$(./version.sh)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}/hermes-agent"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'tags=%s\n' "$image:$version,$image:rolling,$image:latest,$image:sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push multi-architecture image
        id: publish
        working-directory: images/hermes-agent
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          docker buildx bake --push --metadata-file "$RUNNER_TEMP/build-metadata.json" image-all
          digest="$(jq --raw-output '."image-all"["containerimage.digest"]' "$RUNNER_TEMP/build-metadata.json")"
          test -n "$digest" && test "$digest" != "null"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image with Cosign
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

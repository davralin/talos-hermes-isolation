---
apiVersion: batch/v1
kind: Job
metadata:
  name: synapse-bootstrap-admin
  namespace: synapse
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-bootstrap-admin
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 991
        runAsGroup: 991
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: ghcr.io/element-hq/synapse:v1.164.1
          command:
            - /bin/sh
            - -ec
            - |
              until register_new_matrix_user -c /config/homeserver.yaml http://synapse:8008 -u admin --exists-ok -p "$ADMIN_PASSWORD" -a; do
                sleep 5
              done
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synapse
                  key: admin_password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: synapse
            items:
              - key: homeserver.yaml
                path: homeserver.yaml
        - name: tmp
          emptyDir: {}

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name synapse
  namespace: flux-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  targetNamespace: synapse
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      synapse:
        replicas: 1
        initContainers:
          generate-signing-key:
            image:
              repository: ghcr.io/element-hq/synapse
              tag: v1.164.1
            command:
              - python3
            args:
              - -m
              - synapse.app.homeserver
              - --config-path
              - /config/homeserver.yaml
              - --keys-directory
              - /data
              - --generate-keys
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          synapse:
            image:
              repository: ghcr.io/element-hq/synapse
              tag: v1.164.1
            command:
              - python3
            args:
              - -m
              - synapse.app.homeserver
              - --config-path
              - /config/homeserver.yaml
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8008
                  failureThreshold: 30
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
                ephemeral-storage: 512Mi
              limits:
                memory: 1Gi
                ephemeral-storage: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      synapse:
        controller: *name
        ports:
          http:
            port: *port
    persistence:
      data:
        enabled: true
        existingClaim: synapse
        globalMounts:
          - path: /data
      config:
        enabled: true
        type: secret
        name: synapse
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name litellm
  namespace: flux-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *name
    namespace: flux-system
  targetNamespace: litellm
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      litellm:
        replicas: 1
        containers:
          litellm:
            image:
              repository: ghcr.io/berriai/litellm-non_root
              tag: v1.106.6@sha256:6363e53f135dafbf4a68fac25f77aec3f2b99be37665e8c5f623a952637c220b
            command:
              - /app/.venv/bin/litellm
            args:
              - --config
              - /config/config.yaml
            env:
              LITELLM_NON_ROOT: "true"
              LITELLM_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm
                    key: LITELLM_MASTER_KEY
              LITELLM_SALT_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm
                    key: LITELLM_SALT_KEY
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: litellm
                    key: DATABASE_URL
              LITELLM_MIGRATION_DIR: /tmp/migration
              USE_PRISMA_MIGRATE: "true"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: &port 4000
                  failureThreshold: 30
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: *port
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
                ephemeral-storage: 1Gi
              limits:
                memory: 2Gi
                ephemeral-storage: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    configMaps:
      config:
        data:
          config.yaml: |
            model_list: []
            general_settings:
              master_key: os.environ/LITELLM_MASTER_KEY
              store_model_in_db: true
            litellm_settings:
              drop_params: true
    service:
      litellm:
        controller: *name
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        name: litellm
        globalMounts:
          - path: /config
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
    networkpolicies:
      litellm:
        type: cilium
        controller: *name
        ingress:
          - fromEntities:
              - host
            toPorts:
              - ports:
                  - port: "4000"
                    protocol: TCP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: ANY
                rules:
                  dns:
                    - matchName: litellm-postgres-rw.litellm.svc.cluster.local
          - toEndpoints:
              - matchLabels:
                  k8s:cnpg.io/cluster: litellm-postgres
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-policy-v4
  namespace: hermes-agent
immutable: true
data:
  config.yaml: |
    security:
      allow_lazy_installs: false
    model:
      provider: custom
      default: azure-foundry-gpt-5.6-terra
      base_url: http://litellm.litellm.svc.cluster.local:4000/v1
      key_env: HERMES_LITELLM_API_KEY
    sessions:
      auto_prune: true
      retention_days: 180
      vacuum_after_prune: true
    platform_toolsets:
      matrix:
        - cronjob
    platforms:
      matrix:
        group_allowed_chats:
          - "!cl1iLtSaWE74utNrhBGNhzpEOI8ISp7_Yr61rRE9QSQ"
        unauthorized_dm_behavior: ignore
  SOUL.md: |
    You are the Hermes assistant in this Matrix test environment. Use the configured LiteLLM model for replies.

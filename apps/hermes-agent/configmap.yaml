---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-policy
  namespace: hermes-agent
data:
  config.yaml: |
    security:
      allow_lazy_installs: false
    model:
      provider: custom
      default: chat
      base_url: http://litellm.litellm.svc.cluster.local:4000/v1
      key_env: HERMES_LITELLM_API_KEY
    sessions:
      auto_prune: true
      retention_days: 180
      vacuum_after_prune: true
    platform_toolsets:
      matrix:
        - cronjob
        - news
      cron:
        - news
    mcp_servers:
      news:
        enabled: true
        url: http://news-mcp.miniflux.svc.cluster.local.:8081/mcp
        headers:
          Authorization: "Bearer ${MCP_NEWS_API_KEY}"
        tools:
          include:
            - list_news_categories
            - list_news_sources
            - search_news
            - get_news_article
    platforms:
      matrix:
        group_allowed_chats:
          - "!cl1iLtSaWE74utNrhBGNhzpEOI8ISp7_Yr61rRE9QSQ"
        unauthorized_dm_behavior: ignore
  SOUL.md: |
    You are the Hermes assistant in this Matrix test environment. Use the configured LiteLLM model for replies.

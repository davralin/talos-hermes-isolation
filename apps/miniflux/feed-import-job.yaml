---
apiVersion: batch/v1
kind: Job
metadata:
  name: miniflux-feed-import-v1
  namespace: miniflux
  labels:
    app.kubernetes.io/name: miniflux-feed-import
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux-feed-import
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import
          image: docker.io/library/python:3.13-alpine3.23@sha256:bf88c40985006a79ca25458159a4da1dffc457f9ae234e948b2d6df56ca5ebd2
          command:
            - python3
            - /bootstrap/feed_import.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MINIFLUX_URL
              value: http://miniflux.miniflux.svc.cluster.local.:8080
            - name: MINIFLUX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: miniflux-mcp-auth
                  key: miniflux-api-token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: importer
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: importer
          configMap:
            name: miniflux-feed-import-v1
            items:
              - key: feed_import.py
                path: feed_import.py
              - key: feeds.opml
                path: feeds.opml

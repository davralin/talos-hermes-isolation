---
apiVersion: v1
kind: ConfigMap
metadata:
  name: news-mcp-server
  namespace: miniflux
data:
  server.py: |
    #!/usr/bin/env python3
    """Stateless, read-only Streamable HTTP MCP adapter for Miniflux."""

    import hmac
    import json
    import os
    import re
    import threading
    from datetime import datetime, timezone
    from html.parser import HTMLParser
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.error import HTTPError, URLError
    from urllib.parse import urlencode
    from urllib.request import Request, urlopen

    MINIFLUX_URL = os.environ["MINIFLUX_URL"].rstrip("/")
    MINIFLUX_API_TOKEN = os.environ["MINIFLUX_API_TOKEN"]
    MCP_BEARER_TOKEN = os.environ["MCP_BEARER_TOKEN"]
    PORT = int(os.environ.get("PORT", "8081"))
    PROTOCOL_VERSION = "2025-03-26"
    MAX_RESPONSE_BYTES = 4 * 1024 * 1024
    READ_ONLY_ANNOTATIONS = {
        "readOnlyHint": True,
        "destructiveHint": False,
        "idempotentHint": True,
        "openWorldHint": False,
    }


    class TextExtractor(HTMLParser):
        def __init__(self):
            super().__init__(convert_charrefs=True)
            self.parts = []
            self.hidden = 0

        def handle_starttag(self, tag, attrs):
            if tag.lower() in ("script", "style", "noscript"):
                self.hidden += 1
            elif tag.lower() in ("p", "div", "br", "li", "tr", "h1", "h2", "h3"):
                self.parts.append(" ")

        def handle_endtag(self, tag):
            if tag.lower() in ("script", "style", "noscript") and self.hidden:
                self.hidden -= 1
            elif tag.lower() in ("p", "div", "br", "li", "tr", "h1", "h2", "h3"):
                self.parts.append(" ")

        def handle_data(self, data):
            if not self.hidden:
                self.parts.append(data)


    def plain_text(value, limit):
        parser = TextExtractor()
        parser.feed(value or "")
        text = re.sub(r"\s+", " ", " ".join(parser.parts)).strip()
        return text[:limit]


    def miniflux_get(path, params=None):
        query = "?" + urlencode(params) if params else ""
        req = Request(
            MINIFLUX_URL + path + query,
            headers={"X-Auth-Token": MINIFLUX_API_TOKEN, "Accept": "application/json"},
            method="GET",
        )
        try:
            with urlopen(req, timeout=20) as response:
                payload = response.read(MAX_RESPONSE_BYTES + 1)
        except HTTPError as exc:
            raise RuntimeError(f"Miniflux returned HTTP {exc.code}") from None
        except URLError:
            raise RuntimeError("Miniflux API is unreachable") from None
        if len(payload) > MAX_RESPONSE_BYTES:
            raise RuntimeError("Miniflux API response exceeded the size limit")
        return json.loads(payload) if payload else None


    def parse_time(value):
        if not value:
            return None
        parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
        if parsed.tzinfo is None:
            parsed = parsed.replace(tzinfo=timezone.utc)
        return str(int(parsed.timestamp()))


    def categories():
        rows = miniflux_get("/v1/categories") or []
        return [{"id": item.get("id"), "title": item.get("title")} for item in rows]


    def feeds():
        rows = miniflux_get("/v1/feeds") or []
        return [
            {
                "id": item.get("id"),
                "title": item.get("title"),
                "feed_url": item.get("feed_url"),
                "site_url": item.get("site_url"),
                "category": (item.get("category") or {}).get("title"),
                "checked_at": item.get("checked_at"),
                "parsing_error_count": item.get("parsing_error_count"),
            }
            for item in rows
        ]


    def search_news(args):
        params = {"limit": max(1, min(int(args.get("limit", 20)), 50)), "order": "published_at", "direction": "desc"}
        query = args.get("query", "").strip()
        if len(query) > 256:
            raise ValueError("query must be at most 256 characters")
        if query:
            params["search"] = query
        for field, api_field in (("since", "published_after"), ("before", "published_before")):
            if args.get(field):
                params[api_field] = parse_time(args[field])
        if args.get("category_id") is not None:
            params["category_id"] = int(args["category_id"])
        response = miniflux_get("/v1/entries", params)
        entries = response.get("entries", []) if isinstance(response, dict) else response or []
        return {
            "total": response.get("total", len(entries)) if isinstance(response, dict) else len(entries),
            "entries": [
                {
                    "id": item.get("id"),
                    "title": item.get("title"),
                    "url": item.get("url"),
                    "feed": (item.get("feed") or {}).get("title"),
                    "published_at": item.get("published_at"),
                    "author": item.get("author"),
                    "excerpt": plain_text(item.get("content") or item.get("sharing_message"), 1200),
                }
                for item in entries
            ],
        }


    def get_article(args):
        entry_id = int(args["id"])
        if entry_id < 1:
            raise ValueError("id must be a positive integer")
        item = miniflux_get(f"/v1/entries/{entry_id}")
        return {
            "id": item.get("id"),
            "title": item.get("title"),
            "url": item.get("url"),
            "feed": (item.get("feed") or {}).get("title"),
            "published_at": item.get("published_at"),
            "author": item.get("author"),
            "content": plain_text(item.get("content"), 8000),
        }


    TOOLS = [
        {
            "name": "list_news_categories",
            "description": "List the configured news topics/categories.",
            "annotations": READ_ONLY_ANNOTATIONS,
            "inputSchema": {"type": "object", "properties": {}, "additionalProperties": False},
        },
        {
            "name": "list_news_sources",
            "description": "List the subscribed news feeds and their latest polling status.",
            "annotations": READ_ONLY_ANNOTATIONS,
            "inputSchema": {"type": "object", "properties": {}, "additionalProperties": False},
        },
        {
            "name": "search_news",
            "description": "Search recent news by words, topic category, and publication time. Returns short excerpts and links.",
            "annotations": READ_ONLY_ANNOTATIONS,
            "inputSchema": {
                "type": "object",
                "properties": {
                    "query": {"type": "string", "maxLength": 256},
                    "since": {"type": "string", "description": "ISO-8601 timestamp; return articles published after this time."},
                    "before": {"type": "string", "description": "ISO-8601 timestamp; return articles published before this time."},
                    "category_id": {"type": "integer", "minimum": 1},
                    "limit": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20},
                },
                "additionalProperties": False,
            },
        },
        {
            "name": "get_news_article",
            "description": "Retrieve the stored text of a news article by its Miniflux entry ID.",
            "annotations": READ_ONLY_ANNOTATIONS,
            "inputSchema": {
                "type": "object",
                "properties": {"id": {"type": "integer", "minimum": 1}},
                "required": ["id"],
                "additionalProperties": False,
            },
        },
    ]


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        server_version = "HermesMinifluxMCP/1.0"

        def log_message(self, fmt, *args):
            # Do not log request bodies, credentials, or search terms.
            print(f"{self.address_string()} {fmt % args}", flush=True)

        def send_json(self, status, body, protocol=PROTOCOL_VERSION):
            data = json.dumps(body, ensure_ascii=False).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.send_header("Cache-Control", "no-store")
            self.send_header("MCP-Protocol-Version", protocol)
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/healthz":
                self.send_json(200, {"status": "ok"})
            else:
                self.send_error(404)

        def do_POST(self):
            if self.path != "/mcp":
                self.send_error(404)
                return
            auth = self.headers.get("Authorization", "")
            expected = "Bearer " + MCP_BEARER_TOKEN
            if not hmac.compare_digest(auth, expected):
                self.send_json(401, {"error": "unauthorized"})
                return
            request_id = None
            try:
                length = int(self.headers.get("Content-Length", "0"))
                if length < 1 or length > 65536:
                    raise ValueError("request body size is invalid")
                request = json.loads(self.rfile.read(length))
                if not isinstance(request, dict) or request.get("jsonrpc") != "2.0":
                    raise ValueError("invalid JSON-RPC request")
                method = request.get("method")
                request_id = request.get("id")
                protocol = self.headers.get("MCP-Protocol-Version", PROTOCOL_VERSION)
                if method == "notifications/initialized" or (method or "").startswith("notifications/"):
                    self.send_response(202)
                    self.send_header("Content-Length", "0")
                    self.end_headers()
                    return
                params = request.get("params") or {}
                if method == "initialize":
                    result = {
                        "protocolVersion": params.get("protocolVersion", PROTOCOL_VERSION),
                        "capabilities": {"tools": {"listChanged": False}},
                        "serverInfo": {"name": "miniflux-news", "version": "1.0.0"},
                    }
                elif method == "ping":
                    result = {}
                elif method == "tools/list":
                    result = {"tools": TOOLS}
                elif method == "tools/call":
                    result = self.call_tool(params)
                else:
                    self.send_json(200, {"jsonrpc": "2.0", "id": request_id, "error": {"code": -32601, "message": "Method not found"}}, protocol)
                    return
                self.send_json(200, {"jsonrpc": "2.0", "id": request_id, "result": result}, protocol)
            except (ValueError, KeyError, TypeError, json.JSONDecodeError) as exc:
                self.send_json(200, {"jsonrpc": "2.0", "id": request_id, "error": {"code": -32602, "message": str(exc)}})
            except Exception as exc:
                self.send_json(200, {"jsonrpc": "2.0", "id": request_id, "result": {"isError": True, "content": [{"type": "text", "text": str(exc)}]}})

        def call_tool(self, params):
            name = params.get("name")
            args = params.get("arguments") or {}
            functions = {
                "list_news_categories": lambda: categories(),
                "list_news_sources": lambda: feeds(),
                "search_news": lambda: search_news(args),
                "get_news_article": lambda: get_article(args),
            }
            if name not in functions:
                return {"isError": True, "content": [{"type": "text", "text": "Unknown read-only tool"}]}
            try:
                value = functions[name]()
                return {"content": [{"type": "text", "text": json.dumps(value, ensure_ascii=False)}]}
            except (ValueError, KeyError, TypeError) as exc:
                return {"isError": True, "content": [{"type": "text", "text": str(exc)}]}
            except Exception as exc:
                return {"isError": True, "content": [{"type": "text", "text": str(exc)}]}


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - miniflux-release.yaml
  - feed-import-job.yaml
  - mcp-server-config.yaml
  - mcp-release.yaml
  - networkpolicies.yaml
configMapGenerator:
  - name: miniflux-feed-import-v1
    namespace: miniflux
    files:
      - feeds.opml
      - feed_import.py
generatorOptions:
  disableNameSuffixHash: true

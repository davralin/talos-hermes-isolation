---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miniflux-feed-import
  namespace: miniflux
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: miniflux
      k8s:app.kubernetes.io/name: miniflux-feed-import
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: miniflux.miniflux.svc.cluster.local
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: miniflux
            k8s:app.kubernetes.io/controller: miniflux
            k8s:app.kubernetes.io/instance: miniflux-miniflux
            k8s:app.kubernetes.io/name: miniflux-miniflux
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
